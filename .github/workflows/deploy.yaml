name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static site
        run: bun run generate
        env:
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          NUXT_PUBLIC_WORDPRESS_API_URL: ${{ secrets.NUXT_PUBLIC_WORDPRESS_API_URL }}

      - name: Deploy to Hostinger via SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.ssh"
          echo "$SSH_KEY" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> $HOME/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            ./.output/public/ \
            "$SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/deanajbecker.com/public_html/app/"