name: WordPress Content Rebuild

on:
  repository_dispatch:
    types: [wp-content-updated]

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty commit to trigger Hostinger build
        run: |
          git config user.name "wp-rebuild-bot"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "Rebuild: WordPress content updated"
          git push